# Place at .github/workflows/publish-image.yml in a repository with linux-edge/.
name: Publish ArtCraft edge image
on:
  push:
    branches: [main]
    paths: ["linux-edge/**", ".github/workflows/publish-image.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 0"
permissions:
  contents: read
  packages: write
concurrency:
  group: artcraft-image-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tools before publication
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image reference
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: linux-edge
          file: linux-edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
